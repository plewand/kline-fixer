[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kline-fixer"
version = "0.1.0"
description = "Validate timestamp, OHLC, numeric-value, and outlier integrity in candlestick data"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["candlestick", "kline", "ohlc", "pandas", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kline-check = "kline_fixer.cli:main"

[tool.setuptools.packages.find]
include = ["kline_fixer*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
